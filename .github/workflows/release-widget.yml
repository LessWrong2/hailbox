# Publishes the widget as a GitHub release whenever a change to it lands on main. Sites install
# it from the release's tarball URL (see packages/hailbox/README.md). Versions come from
# scripts/next-release-version.mjs: a patch bump, unless packages/hailbox/package.json says higher.
name: Release widget

on:
  push:
    branches: [main]
    paths:
      - packages/hailbox/**
      - scripts/next-release-version.mjs
      - .github/workflows/release-widget.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-widget
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --filter hailbox

      - name: Check and build
        working-directory: packages/hailbox
        run: |
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Choose version
        id: version
        run: echo "version=$(node scripts/next-release-version.mjs)" >> "$GITHUB_OUTPUT"

      - name: Pack
        working-directory: packages/hailbox
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm pack

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/hailbox-${VERSION}.tgz"
          gh release create "v${VERSION}" "packages/hailbox/hailbox-${VERSION}.tgz" \
            --target "$GITHUB_SHA" \
            --title "hailbox ${VERSION}" \
            --generate-notes \
            --notes "Install by adding this to your package.json dependencies: \`\"hailbox\": \"${url}\"\`"
